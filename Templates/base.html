{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Soko Hub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{% static 'media/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
 <style>
/* ================= ROOT COLORS ================= */
:root {
    /* Brand & Trust */
    --color-primary: #0056D2;     /* Deep Royal Blue */
    --color-accent: #FF6B00;      /* CTA Orange */

    /* Neutrals */
    --color-white: #FFFFFF;
    --color-light: #F4F6F8;

    /* Text */
    --color-text: #1F2937;
    --color-muted: #6B7280;

    /* Status (limited use only) */
    --color-success: #16A34A;
    --color-warning: #FACC15;
    --color-danger: #DC2626;
}

/* ================= RESET ================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* ================= BODY ================= */
body {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.7;
    color: var(--color-text);
    background-color: var(--color-light);
}

/* ================= CONTAINER ================= */
.container {
    width: 92%;
    max-width: 1200px;
    margin: auto;
}

/* ================= HEADINGS ================= */
h1, h2, h3, h4 {
    font-weight: 800;
    color: var(--color-text);
}

.section-heading {
    font-size: 2.6rem;
    color: var(--color-primary);
    border-bottom: 4px solid var(--color-primary);
    display: inline-block;
    padding-bottom: 8px;
    margin-bottom: 3rem;
}

/* ================= LINKS ================= */
a {
    color: var(--color-primary);
    text-decoration: none;
    transition: color 0.25s ease;
}

a:hover {
    color: var(--color-accent);
}

/* ================= BUTTONS ================= */
.btn {
    font-weight: 600;
    border-radius: 8px;
}

/* PRIMARY CTA — BUY / ADD TO CART ONLY */
.btn-primary {
    background-color: var(--color-accent);
    border: none;
    color: #ffffff;
}

.btn-primary:hover {
    background-color: #e55f00;
}

/* SECONDARY BUTTONS */
.btn-outline-primary {
    color: var(--color-primary);
    border-color: var(--color-primary);
}

.btn-outline-primary:hover {
    background-color: var(--color-primary);
    color: #ffffff;
}

/* ================= HEADER / NAVBAR ================= */
header {
    background-color: var(--color-primary);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    position: sticky;
    top: 0;
    z-index: 1000;
}

nav h1 {
    color: var(--color-white);
    font-size: 1.9rem;
    font-weight: 900;
}

nav ul li a {
    color: var(--color-white);
    font-weight: 500;
}

nav ul li a:hover {
    color: var(--color-accent);
}


/* ================= CARDS ================= */
.card {
    background-color: var(--color-white);
    border: none;
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 32px rgba(0, 0, 0, 0.1);
}

.card-title {
    font-weight: 700;
    color: var(--color-text);
}

/* ================= BADGES ================= */
.badge {
    font-size: 0.75rem;
    padding: 0.45em 0.7em;
    border-radius: 6px;
}

/* ================= ASSURANCE / SUPPORT ================= */
#assurance-support {
    background-color: var(--color-white);
    border-top: 1px solid #e5e7eb;
}

/* ================= FOOTER ================= */
footer {
    background-color: #0f172a;
    color: #e5e7eb;
    padding: 3rem 1rem;
    text-align: center;
}

footer p {
    margin-bottom: 0.4rem;
}

.social-links a {
    color: #e5e7eb;
    font-size: 1.8rem;
    margin: 0 12px;
    transition: transform 0.25s ease, color 0.25s ease;
}

.social-links a:hover {
    color: var(--color-accent);
    transform: scale(1.15);
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
    #hero h1 {
        font-size: 2.4rem;
    }

    #hero .subtitle {
        font-size: 1.1rem;
    }
}
</style>


</head>
<body>
    {% include 'includes/navbar.html' %} 

    <main class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}

</body>
</html>
